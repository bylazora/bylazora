[package]
name = "bylazora-core"
version = "0.5.0"
edition = "2021"
description = "Byte-exact COBOL mainframe migration engine: one binary runs the equivalence gate and the production runtime across CPU, any-GPU (wgpu) and CUDA tiers, with an MCP server for coding agents."
readme = "README.md"
repository = "https://github.com/bylazora/bylazora"
homepage = "https://bylazora.com"
keywords = ["cobol", "mainframe", "migration", "gpu", "cuda"]
categories = ["command-line-utilities", "development-tools"]
license = "AGPL-3.0-or-later AND Apache-2.0"

[lib]
name = "bylazora"
crate-type = ["cdylib", "rlib"]

[dependencies]
anyhow = "1"
bytemuck = "1"
clap = { version = "4", features = ["derive"] }
csv = "1"
cudarc = { version = "0.14", features = ["cuda-version-from-build-system"], optional = true }
ed25519-dalek = "2"
pollster = "0.4"
rayon = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
wgpu = "24"

[features]
default = []
cuda = ["dep:cudarc"]

[profile.release]
opt-level = 3
strip = "symbols"
