[package]
name = "bylazora-core"
version = "0.4.1"
edition = "2021"
license = "AGPL-3.0-or-later"

[lib]
name = "bylazora"
crate-type = ["cdylib", "rlib"]

[dependencies]
anyhow = "1"
bytemuck = "1"
clap = { version = "4", features = ["derive"] }
csv = "1"
cudarc = { version = "0.14", features = ["cuda-version-from-build-system"] }
ed25519-dalek = "2"
pollster = "0.4"
rayon = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
wgpu = "24"

[profile.release]
opt-level = 3
