# Strip the build host's identity out of panic messages and debug info.
# Third-party crate source paths land under CARGO_HOME (~/.cargo on any
# standard rustup install) and get embedded verbatim via file!()/panic
# locations; on the build host that path leaked the account name into the
# shipped binary (189 occurrences of /home/algolotl/.cargo, found 2026-09-13).
# This remap is host-independent, since ~/.cargo is the same convention
# everywhere, so it is safe to commit.
#
# This does NOT remap the crate's own source paths, since those live under
# whatever directory the crate is checked out to and vary per build host; that
# half needs an explicit --remap-path-prefix=<build dir>=/build at build time.
#
# CAUTION: setting RUSTFLAGS in the environment REPLACES this [build] rustflags
# list rather than adding to it. A build that passes only the crate-dir remap
# therefore silently drops the /cargo one and ships 187 occurrences of
# /home/algolotl (measured 2026-09-14, during the 0.4.2 release). Carry both:
#
#   RUSTFLAGS="--remap-path-prefix=$PWD=/build \
#              --remap-path-prefix=/home/algolotl/.cargo=/cargo" \
#     cargo build --release
#
# Then assert zero: strings target/release/bylazora-core | grep -c /home/algolotl
[build]
rustflags = ["--remap-path-prefix=/home/algolotl/.cargo=/cargo"]
